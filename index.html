<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>google sign in</title>
</head>
      <link rel="stylesheet" href="style.css">
<body>
    <div class="main">
        <div class="main-2">
        <div class="google-text">
            <div class="left">
                <img src="./google-logo-on-transparent-white-background-free-vector.jpg" alt="google logo">
                <span class="sign-in-text">Sign in</span>
                <span>with your google account.This account will be available to other google app in the browser.</span>
            </div>
            <div class="right">
                <div class="input-box">
                    <input type="text" placeholder="Enter your Email">
                
                <span>
                    <a href="#">Forget email?</a>
                </span>
                </div>
                <div class="text">
                    <div class="para">
                    <span>
                        Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more about using Guest mode</a>
                    </span>
                    </div>
                    <div class="btn">
                       <div class="btn-1"> <button>Create account</button></div>
                       <div class="btn-2"> <button>Next</button></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="links">
                        <select name="Language" id="">
                            <option value="English">English (United States)</option>
                            <option value="Urdu">Urdu</option>
                            <option value="French">French</option>
                        </select>
             <div class="links-2">
                <a href="#">Help</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
             </div>

                


              
        </div>
        </div> 
    </div>
    
</body>
</html>
